name: Deploy VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_ONLINE_CORE_URL: ${{ secrets.VITE_ONLINE_CORE_URL }}
        run: npm run build

      - name: Create deploy archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='server/data' \
            -czf movie-business-deploy.tgz \
            dist \
            public \
            server \
            package.json \
            package-lock.json \
            ecosystem.config.cjs

      - name: Copy archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 10m
          debug: true
          source: movie-business-deploy.tgz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 15m
          debug: true
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R $USER:$USER "$APP_DIR"
            cd "$APP_DIR"

            if ! command -v npm > /dev/null; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            tar -xzf /tmp/movie-business-deploy.tgz -C "$APP_DIR"

            npm ci --omit=dev

            if ! command -v pm2 > /dev/null; then
              sudo npm install -g pm2
            fi

            if ! command -v nginx > /dev/null; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            API_DOMAIN="${{ secrets.VPS_API_DOMAIN }}"
            if [ -n "$API_DOMAIN" ]; then
              sudo sh -c "printf '%s\n' \
              'server {' \
              '  listen 80;' \
              \"  server_name ${API_DOMAIN};\" \
              '' \
              '  location / {' \
              '    proxy_pass http://127.0.0.1:8787;' \
              '    proxy_http_version 1.1;' \
              '    proxy_set_header Host $host;' \
              '    proxy_set_header X-Real-IP $remote_addr;' \
              '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '    proxy_set_header X-Forwarded-Proto $scheme;' \
              '  }' \
              '}' > /etc/nginx/sites-available/movie-business-api"
              sudo ln -sf /etc/nginx/sites-available/movie-business-api /etc/nginx/sites-enabled/movie-business-api
            fi

            pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs --update-env
            pm2 save

            sudo nginx -t
            sudo systemctl enable nginx || true
            sudo systemctl start nginx || true
            sudo systemctl reload nginx
