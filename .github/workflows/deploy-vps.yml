name: Deploy VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_ONLINE_CORE_URL: ${{ secrets.VITE_ONLINE_CORE_URL }}
        run: npm run build

      - name: Create deploy archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='server/data' \
            -czf movie-business-deploy.tgz \
            dist \
            public \
            server \
            package.json \
            package-lock.json \
            ecosystem.config.cjs

      - name: Normalize SSH target
        id: ssh_target
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e

          RAW_HOST="$(echo "${VPS_HOST:-}" | xargs)"
          RAW_PORT="$(echo "${VPS_PORT:-}" | xargs)"

          if [ -z "$RAW_HOST" ]; then
            echo "VPS_HOST secret is missing" >&2
            exit 1
          fi

          # Accept secrets like https://host:8787/path and extract plain host.
          RAW_HOST="${RAW_HOST#http://}"
          RAW_HOST="${RAW_HOST#https://}"
          RAW_HOST="${RAW_HOST%%/*}"
          RAW_HOST="${RAW_HOST%%:*}"

          if [ -z "$RAW_HOST" ]; then
            echo "Unable to derive SSH host from VPS_HOST secret" >&2
            exit 1
          fi

          if [[ "$RAW_PORT" =~ ^[0-9]+$ ]]; then
            BASE_PORT="$RAW_PORT"
          else
            BASE_PORT="22"
          fi

          echo "host=$RAW_HOST" >> "$GITHUB_OUTPUT"
          echo "base_port=$BASE_PORT" >> "$GITHUB_OUTPUT"

      - name: Detect reachable SSH port
        id: ssh_port
        env:
          VPS_HOST: ${{ steps.ssh_target.outputs.host }}
          BASE_PORT: ${{ steps.ssh_target.outputs.base_port }}
        run: |
          set +e

          CANDIDATES="${BASE_PORT},22"
          SELECTED=""

          IFS=',' read -ra PORTS <<< "$CANDIDATES"
          for RAW_PORT in "${PORTS[@]}"; do
            PORT="$(echo "$RAW_PORT" | xargs)"
            if [ -z "$PORT" ]; then
              continue
            fi

            if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
              echo "Skipping non-numeric SSH port candidate: $PORT"
              continue
            fi

            echo "Checking TCP reachability for $VPS_HOST:$PORT"
            if nc -z -w 5 "$VPS_HOST" "$PORT" >/dev/null 2>&1 || timeout 8 bash -lc "</dev/tcp/$VPS_HOST/$PORT" 2>/dev/null; then
              SELECTED="$PORT"
              echo "Reachable SSH port found: $PORT"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "No reachable SSH port found for host $VPS_HOST (checked: $CANDIDATES)."
            echo "Continuing with fallback SSH port $BASE_PORT; deploy may still work depending on network/firewall timing."
            SELECTED="$BASE_PORT"
          fi

          echo "port=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Show resolved SSH target
        run: |
          echo "Resolved SSH host: ${{ steps.ssh_target.outputs.host }}"
          echo "Resolved SSH port: ${{ steps.ssh_port.outputs.port }}"

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps_deploy
          chmod 600 ~/.ssh/id_vps_deploy

      - name: Copy archive to VPS (with retries)
        env:
          VPS_HOST: ${{ steps.ssh_target.outputs.host }}
          VPS_PORT: ${{ steps.ssh_port.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="./movie-business-deploy.tgz"

          if [ ! -f "$ARCHIVE_PATH" ]; then
            echo "Deploy archive not found: $ARCHIVE_PATH" >&2
            exit 1
          fi

          # Normalize and validate connection inputs before invoking scp.
          VPS_USER="$(echo "${VPS_USER:-}" | tr -d '\r' | xargs)"
          VPS_HOST="$(echo "${VPS_HOST:-}" | tr -d '\r' | xargs)"
          VPS_PORT="$(echo "${VPS_PORT:-}" | tr -d '\r' | xargs)"

          if [ -z "$VPS_USER" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_PORT" ]; then
            echo "Missing one of VPS_USER/VPS_HOST/VPS_PORT after normalization." >&2
            exit 1
          fi

          if ! [[ "$VPS_USER" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "VPS_USER contains invalid characters for SSH username." >&2
            exit 1
          fi

          if ! [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "VPS_HOST contains invalid characters for SSH host." >&2
            exit 1
          fi

          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "VPS_PORT is not numeric: '$VPS_PORT'" >&2
            exit 1
          fi

          REMOTE_TARGET="${VPS_USER}@${VPS_HOST}:movie-business-deploy.tgz"

          SSH_OPTS=(
            -i ~/.ssh/id_vps_deploy
            -P "$VPS_PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          success=0
          for attempt in 1 2 3 4; do
            echo "SCP attempt ${attempt}/4"
            if scp "${SSH_OPTS[@]}" -- "$ARCHIVE_PATH" "$REMOTE_TARGET"; then
              success=1
              break
            fi
            echo "SCP failed on attempt ${attempt}; retrying in 10s..."
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "SCP failed after 4 attempts. Check VPS_HOST/VPS_PORT/firewall (OpenSSH) and Hostinger SSH access." >&2
            exit 1
          fi

      - name: Deploy on VPS (with retries)
        env:
          VPS_HOST: ${{ steps.ssh_target.outputs.host }}
          VPS_PORT: ${{ steps.ssh_port.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_FRONTEND_DOMAIN: ${{ secrets.VPS_FRONTEND_DOMAIN }}
          VPS_API_DOMAIN: ${{ secrets.VPS_API_DOMAIN }}
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -i ~/.ssh/id_vps_deploy
            -p "$VPS_PORT"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          run_remote_deploy() {
            ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" \
              APP_DIR="$VPS_APP_DIR" FRONTEND_DOMAIN="$VPS_FRONTEND_DOMAIN" API_DOMAIN="$VPS_API_DOMAIN" \
              'bash -s' <<'REMOTE'
          set -e
          ARCHIVE_PATH="$HOME/movie-business-deploy.tgz"

          if [ ! -f "$ARCHIVE_PATH" ]; then
            echo "Deploy archive not found on server: $ARCHIVE_PATH" >&2
            exit 1
          fi

          sudo mkdir -p "$APP_DIR"
          sudo chown -R $USER:$USER "$APP_DIR"
          cd "$APP_DIR"

          if ! command -v npm > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl
            curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          tar -xzf "$ARCHIVE_PATH" -C "$APP_DIR"
          rm -f "$ARCHIVE_PATH"

          npm ci --omit=dev

          if ! command -v pm2 > /dev/null; then
            sudo npm install -g pm2
          fi

          if ! command -v nginx > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y nginx
          fi

          if [ -n "$FRONTEND_DOMAIN" ]; then
            sudo printf '%s\n' \
              "server {" \
              "  listen 80;" \
              "  server_name ${FRONTEND_DOMAIN} www.${FRONTEND_DOMAIN};" \
              "  root ${APP_DIR}/dist;" \
              "  index index.html;" \
              "" \
              "  location / {" \
              "    try_files \$uri \$uri/ /index.html;" \
              "  }" \
              "}" | sudo tee /etc/nginx/sites-available/movie-business-frontend >/dev/null
            sudo ln -sf /etc/nginx/sites-available/movie-business-frontend /etc/nginx/sites-enabled/movie-business-frontend
          fi

          if [ -n "$API_DOMAIN" ]; then
            sudo printf '%s\n' \
              "server {" \
              "  listen 80;" \
              "  server_name ${API_DOMAIN};" \
              "" \
              "  location / {" \
              "    proxy_pass http://127.0.0.1:8787;" \
              "    proxy_http_version 1.1;" \
              '    proxy_set_header Host $host;' \
              '    proxy_set_header X-Real-IP $remote_addr;' \
              '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '    proxy_set_header X-Forwarded-Proto $scheme;' \
              "  }" \
              "}" | sudo tee /etc/nginx/sites-available/movie-business-api >/dev/null
            sudo ln -sf /etc/nginx/sites-available/movie-business-api /etc/nginx/sites-enabled/movie-business-api
          fi

          sudo rm -f /etc/nginx/sites-enabled/default

          pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs --update-env
          pm2 save

          sudo nginx -t
          sudo systemctl enable nginx || true
          sudo systemctl start nginx || true
          sudo systemctl reload nginx
          REMOTE
          }

          success=0
          for attempt in 1 2 3; do
            echo "SSH deploy attempt ${attempt}/3"
            if run_remote_deploy; then
              success=1
              break
            fi
            echo "SSH deploy failed on attempt ${attempt}; retrying in 10s..."
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "SSH deploy failed after 3 attempts." >&2
            exit 1
          fi
