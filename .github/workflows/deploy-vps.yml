name: Deploy VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_ONLINE_CORE_URL: ${{ secrets.VITE_ONLINE_CORE_URL }}
        run: npm run build

      - name: Create deploy archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='server/data' \
            -czf movie-business-deploy.tgz \
            dist \
            public \
            server \
            package.json \
            package-lock.json \
            ecosystem.config.cjs

      - name: Detect reachable SSH port
        id: ssh_port
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e

          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST secret is missing" >&2
            exit 1
          fi

          CANDIDATES="${VPS_PORT},22"
          SELECTED=""

          IFS=',' read -ra PORTS <<< "$CANDIDATES"
          for RAW_PORT in "${PORTS[@]}"; do
            PORT="$(echo "$RAW_PORT" | xargs)"
            if [ -z "$PORT" ]; then
              continue
            fi

            if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
              echo "Skipping non-numeric SSH port candidate: $PORT"
              continue
            fi

            echo "Checking TCP reachability for $VPS_HOST:$PORT"
            if timeout 8 bash -lc "</dev/tcp/$VPS_HOST/$PORT" 2>/dev/null; then
              SELECTED="$PORT"
              echo "Reachable SSH port found: $PORT"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "No reachable SSH port found for host $VPS_HOST (checked: $CANDIDATES)." >&2
            echo "Please verify VPS_PORT secret and Hostinger firewall/UFW rules for GitHub Actions runner access." >&2
            exit 1
          fi

          echo "port=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Copy archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.ssh_port.outputs.port }}
          timeout: 120s
          command_timeout: 10m
          debug: true
          source: movie-business-deploy.tgz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.ssh_port.outputs.port }}
          timeout: 120s
          command_timeout: 15m
          debug: true
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R $USER:$USER "$APP_DIR"
            cd "$APP_DIR"

            if ! command -v npm > /dev/null; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            tar -xzf /tmp/movie-business-deploy.tgz -C "$APP_DIR"

            npm ci --omit=dev

            if ! command -v pm2 > /dev/null; then
              sudo npm install -g pm2
            fi

            if ! command -v nginx > /dev/null; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            FRONTEND_DOMAIN="${{ secrets.VPS_FRONTEND_DOMAIN }}"
            if [ -n "$FRONTEND_DOMAIN" ]; then
              sudo printf '%s\n' \
                "server {" \
                "  listen 80;" \
                "  server_name ${FRONTEND_DOMAIN} www.${FRONTEND_DOMAIN};" \
                "  root ${APP_DIR}/dist;" \
                "  index index.html;" \
                "" \
                "  location / {" \
                "    try_files \$uri \$uri/ /index.html;" \
                "  }" \
                "}" | sudo tee /etc/nginx/sites-available/movie-business-frontend >/dev/null
              sudo ln -sf /etc/nginx/sites-available/movie-business-frontend /etc/nginx/sites-enabled/movie-business-frontend
            fi

            API_DOMAIN="${{ secrets.VPS_API_DOMAIN }}"
            if [ -n "$API_DOMAIN" ]; then
              sudo printf '%s\n' \
                "server {" \
                "  listen 80;" \
                "  server_name ${API_DOMAIN};" \
                "" \
                "  location / {" \
                "    proxy_pass http://127.0.0.1:8787;" \
                "    proxy_http_version 1.1;" \
                '    proxy_set_header Host $host;' \
                '    proxy_set_header X-Real-IP $remote_addr;' \
                '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
                '    proxy_set_header X-Forwarded-Proto $scheme;' \
                "  }" \
                "}" | sudo tee /etc/nginx/sites-available/movie-business-api >/dev/null
              sudo ln -sf /etc/nginx/sites-available/movie-business-api /etc/nginx/sites-enabled/movie-business-api
            fi

            sudo rm -f /etc/nginx/sites-enabled/default

            pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs --update-env
            pm2 save

            sudo nginx -t
            sudo systemctl enable nginx || true
            sudo systemctl start nginx || true
            sudo systemctl reload nginx
