name: Deploy VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_ONLINE_CORE_URL: ${{ secrets.VITE_ONLINE_CORE_URL }}
        run: npm run build

      - name: Create deploy archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='server/data' \
            -czf movie-business-deploy.tgz \
            dist \
            public \
            server \
            package.json \
            package-lock.json \
            ecosystem.config.cjs

      - name: Copy archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: movie-business-deploy.tgz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R $USER:$USER "$APP_DIR"
            cd "$APP_DIR"

            tar -xzf /tmp/movie-business-deploy.tgz -C "$APP_DIR"

            npm ci --omit=dev

            if ! command -v pm2 > /dev/null; then
              sudo npm install -g pm2
            fi

            pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs --update-env
            pm2 save

            sudo nginx -t
            sudo systemctl reload nginx
